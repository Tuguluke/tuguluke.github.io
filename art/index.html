<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art — Tugluk</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --muted: #888;
      --accent: #7c9ef8;
      --accent2: #5eead4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container { max-width: 960px; margin: 0 auto; padding: 0 24px; }

    nav {
      border-bottom: 1px solid var(--border);
      padding: 20px 0;
      position: sticky; top: 0;
      background: var(--bg);
      z-index: 10;
    }
    nav .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav .logo { font-weight: 600; color: var(--text); font-size: 1rem; }
    nav ul { list-style: none; display: flex; gap: 28px; }
    nav ul a { color: var(--muted); font-size: 0.9rem; }
    nav ul a:hover { color: var(--text); text-decoration: none; }
    nav ul a.active { color: var(--accent); }

    .page-header {
      padding: 60px 0 40px;
      border-bottom: 1px solid var(--border);
    }
    .page-header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 10px; }
    .page-header p { color: var(--muted); font-size: 0.95rem; }

    .gallery {
      padding: 48px 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .gallery-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
      cursor: pointer;
    }
    .gallery-item:hover { border-color: var(--accent); }

    .gallery-item img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 6px;
    }
    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 28px;
      font-size: 2rem;
      color: var(--muted);
      cursor: pointer;
      line-height: 1;
      background: none;
      border: none;
    }
    .lightbox-close:hover { color: var(--text); }

    footer {
      padding: 40px 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <nav>
    <div class="container">
      <a href="../index.html" class="logo">Tugluk</a>
      <ul>
        <li><a href="../index.html#projects">Projects</a></li>
        <li><a href="../books.html">Books</a></li>
        <li><a href="index.html" class="active">Art</a></li>
      </ul>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1>Art</h1>
      <p>A collection of my artwork.</p>
    </div>
  </div>

  <div class="container">
    <div class="gallery">
      <div class="gallery-item" onclick="openLightbox('IMG_0578.JPG')">
        <img src="IMG_0578.JPG" alt="Artwork" loading="lazy" />
      </div>
      <div class="gallery-item" onclick="openLightbox('IMG_0579.JPG')">
        <img src="IMG_0579.JPG" alt="Artwork" loading="lazy" />
      </div>
      <div class="gallery-item" onclick="openLightbox('IMG_0580.JPG')">
        <img src="IMG_0580.JPG" alt="Artwork" loading="lazy" />
      </div>
      <div class="gallery-item" onclick="openLightbox('IMG_0581.JPG')">
        <img src="IMG_0581.JPG" alt="Artwork" loading="lazy" />
      </div>
      <div class="gallery-item" onclick="openLightbox('IMG_0582.JPG')">
        <img src="IMG_0582.JPG" alt="Artwork" loading="lazy" />
      </div>
      <div class="gallery-item" onclick="openLightbox('IMG_0583.JPG')">
        <img src="IMG_0583.JPG" alt="Artwork" loading="lazy" />
      </div>
      <div class="gallery-item" onclick="openLightbox('IMG_0584.JPG')">
        <img src="IMG_0584.JPG" alt="Artwork" loading="lazy" />
      </div>
      <div class="gallery-item" onclick="openLightbox('IMG_0585.JPG')">
        <img src="IMG_0585.JPG" alt="Artwork" loading="lazy" />
      </div>
      <div class="gallery-item" onclick="openLightbox('IMG_0586.JPG')">
        <img src="IMG_0586.JPG" alt="Artwork" loading="lazy" />
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img id="lightbox-img" src="" alt="Artwork" />
  </div>

  <footer>
    <div class="container">
      <p>Tugluk &mdash; <a href="https://github.com/tuguluke" target="_blank">GitHub</a></p>
    </div>
  </footer>

  <script>
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox(e) {
      if (!e || e.target !== document.getElementById('lightbox-img')) {
        document.getElementById('lightbox').classList.remove('open');
      }
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

</body>
</html>
